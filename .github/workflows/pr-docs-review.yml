name: PR review

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PR review dependencies
        run: pip install -r pr_review/requirements.txt

      # Host repo can be any language. This job only needs Python to run pr_review.

      - name: Review pull request
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Optional: override model, e.g. gemini-2.5-pro
          # GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python -m pr_review --pr ${{ github.event.pull_request.number }} --docs docs/tech
